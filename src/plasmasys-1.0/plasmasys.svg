<svg class="icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!--
    This SVG is designed to represent a sensor transmitting data.
    - The gradient background gives it a modern, techy feel.
    - The central dot represents the sensor itself.
    - The radiating arcs symbolize data waves or signals being monitored.
    -->

    <!-- Define the gradient for the background -->
    <defs>
        <linearGradient id="iconGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#34d399; stop-opacity:1" />
            <stop offset="100%" style="stop-color:#3b82f6; stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background Shape: A rounded rectangle (squircle) -->
    <rect width="100" height="100" rx="24" ry="24" fill="url(#iconGradient)" />

    <!-- Group for the central sensor and signal waves -->
    <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
        <!-- Central point (the sensor) -->
        <circle cx="50" cy="50" r="6" stroke-width="3" fill="#ffffff" />

        <!-- Outgoing signal waves -->
        <path d="M 35 50 A 15 15 0 0 1 65 50" stroke-width="4" />
        <path d="M 25 50 A 25 25 0 0 1 75 50" stroke-width="4" />
        <path d="M 15 50 A 35 35 0 0 1 85 50" stroke-width="4" />
    </g>
</svg>
